name: CI & Deploy
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install

      - name: Check README TOC
        uses: runsascoded/mdcmd@v1

      - name: Build library
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test

      - name: Install site dependencies
        working-directory: ./site
        run: pnpm install

      - name: Build site
        working-directory: ./site
        run: pnpm run build

      - name: Install Playwright browsers
        working-directory: ./site
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./site
        run: pnpm run e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7

      # Production: deploy the demo as a Cloudflare Worker (Static Assets) to
      # prms.rbw.sh. Main only. `docs/` was built by the "Build site" step.
      - name: Deploy Worker (prms.rbw.sh)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run deploy

  build-dist:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    uses: runsascoded/npm-dist/.github/workflows/build-dist.yml@v1

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    uses: runsascoded/pnpm-release/.github/workflows/release.yml@v1
    with:
      # `pnpm-release`'s OIDC branch installs `npm@latest` (needs npm >= 11.5.1 for
      # trusted publishing); npm@12 dropped Node 20, so bump the runner past the
      # reusable workflow's `node_version: 20` default.
      node_version: '22'
    # Publishes via npm OIDC trusted publishing (configured on npmjs.com), no
    # NPM_TOKEN secret needed. The reusable workflow already grants
    # `id-token: write` on its release job.
